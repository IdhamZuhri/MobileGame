<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Mobile Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="hud-biome"></span><span id="hud-pos"></span><span id="hud-fps"></span></div>
<button id="reset" title="Reset progress">⟲</button>
<div id="levelup"><h2 id="lu-title"></h2><div id="cards"></div></div>
<button id="bag-btn">🎒 0</button>
<div id="inventory">
  <div class="panel">
    <div class="row"><h2>Gear</h2><button id="inv-close">✕</button></div>
    <div id="inv-stats"></div>
    <div id="inv-equipped"></div>
    <div id="inv-count"></div>
    <div id="inv-bag"></div>
    <div id="inv-detail"></div>
  </div>
</div>
<div id="stick"><div id="knob"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
